# RMSE
[plot_rmse_ts]
copy_id = brier_ts
plottype = rmse
area_statistic = score:mean

[plot_rmse_map]
copy_id = brier_map
plottype = rmse

# SER
[plot_ser_ts]
copy_id = brier_ts
plottype = ser
area_statistic = score:mean

[plot_ser_map]
